name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies and compile Python sources
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m compileall -q backend/app
      - name: Compile C++17 evaluation engine
        run: g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic backend/cpp/femtrace_engine.cpp -o /tmp/femtrace_engine
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build React and TypeScript frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
